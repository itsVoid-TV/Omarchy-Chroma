name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Download pinned ble.sh
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 180 --retry 3 --retry-all-errors \
            'https://github.com/akinomyoga/ble.sh/releases/download/nightly/ble-nightly-20260818%2B63c23e9.tar.xz' \
            --output /tmp/blesh.tar.xz
          echo 'f033df78cbe6017b2bc8286852f9e4edd18fbddf0025faf19967726e06577189  /tmp/blesh.tar.xz' | sha256sum --check
          mkdir -p /tmp/blesh
          tar --no-same-owner -xJf /tmp/blesh.tar.xz -C /tmp/blesh --strip-components=1
      - name: Download pinned Omarchy themes
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 180 --retry 3 --retry-all-errors \
            'https://github.com/omacom/omarchy/archive/493067741e081c3b09082da6bfd51e99ec24ef00.tar.gz' \
            --output /tmp/omarchy.tar.gz
          echo '6456b3d5b8e28af78d67972b5f0ea4890d088a579aec4a4c7ba694ca9a3a028b  /tmp/omarchy.tar.gz' | sha256sum --check
          mkdir -p /tmp/omarchy
          tar --no-same-owner -xzf /tmp/omarchy.tar.gz -C /tmp/omarchy --strip-components=1
      - name: Run tests
        env:
          CHROMA_BLESH_PATH: /tmp/blesh/ble.sh
          CHROMA_OMARCHY_THEMES_DIR: /tmp/omarchy/themes
          CHROMA_QMLTESTRUNNER: /usr/lib/qt6/bin/qmltestrunner
        run: bash tests/run.bash
      - name: Keep control-view render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-chroma-control-view
          path: |
            chroma-dark.png
            chroma-light.png
            chroma-narrow.png
          if-no-files-found: ignore
          retention-days: 7
